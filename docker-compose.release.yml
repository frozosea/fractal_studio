services:
  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-15442}:5432"

  redis:
    ports: !override
      - "127.0.0.1:${REDIS_PORT:-16389}:6379"

  minio:
    ports: !override
      - "127.0.0.1:${MINIO_PORT:-19010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19011}:9001"

  compute:
    ports: !override
      - "127.0.0.1:${COMPUTE_PORT:-18101}:18080"

  compute-b:
    ports: !override
      - "127.0.0.1:${COMPUTE_B_PORT:-18104}:18080"

  compute-gateway-db:
    ports: !reset []

  compute-gateway:
    ports: !reset []
    volumes: !reset []

  compute-gateway-migrate:
    volumes: !reset []

  migrate:
    environment:
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: ${FSD_API_ORIGIN:-https://fractal.kevin0412.top}
      S3_SERVER_SIDE_ENCRYPTION: AES256
    volumes: !reset []

  alipay-stub:
    ports: !override
      - "127.0.0.1:${ALIPAY_STUB_PORT:-18102}:8000"

  api:
    environment:
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: ${FSD_API_ORIGIN:-https://fractal.kevin0412.top}
      S3_SERVER_SIDE_ENCRYPTION: AES256
    ports: !override
      - "127.0.0.1:${PLATFORM_PORT:-18100}:8000"
    volumes: !override
      - ./alipay_app_private.pem:/run/secrets/alipay_app_private.pem:ro
      - ./alipay_sandbox_public.pem:/run/secrets/alipay_sandbox_public.pem:ro

  worker:
    environment:
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: ${FSD_API_ORIGIN:-https://fractal.kevin0412.top}
      S3_SERVER_SIDE_ENCRYPTION: AES256
    volumes: !override
      - ./alipay_app_private.pem:/run/secrets/alipay_app_private.pem:ro
      - ./alipay_sandbox_public.pem:/run/secrets/alipay_sandbox_public.pem:ro

  preview-worker:
    environment:
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: ${FSD_API_ORIGIN:-https://fractal.kevin0412.top}
      S3_SERVER_SIDE_ENCRYPTION: AES256
    volumes: !override
      - ./alipay_app_private.pem:/run/secrets/alipay_app_private.pem:ro
      - ./alipay_sandbox_public.pem:/run/secrets/alipay_sandbox_public.pem:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.release
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_PLATFORM_API_URL: /platform
      PLATFORM_INTERNAL_URL: http://api:8000
    command: !reset null
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3010}:3000"
    volumes: !reset []
