name: ${COMPOSE_PROJECT_NAME:?set a unique Compose project in this node's compute.env}
services:
  compute:
    image: ${COMPUTE_IMAGE:?immutable Git-SHA image required}
    restart: unless-stopped
    runtime: nvidia
    gpus: all
    environment:
      FSD_STARTUP_BENCHMARK: ${FSD_STARTUP_BENCHMARK:-quick}
      FSD_COMPUTE_SERVICE_KEY: ${FSD_COMPUTE_SERVICE_KEY:?set in this node's root-only compute.env}
      FSD_RENDERER_VERSION: ${FSD_RENDERER_VERSION:?set in this node's root-only compute.env}
      FSD_RENDER_THREADS: ${FSD_RENDER_THREADS:-2}
      FSD_THERMAL_FRIENDLY: ${FSD_THERMAL_FRIENDLY:-0}
      FSD_ENABLE_LEGACY_API: "0"
      FSD_ENABLE_LEGACY_FORMULA_COMPILER: "0"
    ports: ["${COMPUTE_BIND_IP:?set this node's unique WireGuard address in compute.env}:18080:18080"]
    volumes: ["${COMPUTE_RUNTIME_PATH:?set this node's unique runtime path in compute.env}:/workspace/fractal_studio/runtime"]
    healthcheck: {test: [CMD, curl, -fsS, "http://127.0.0.1:18080/compute/v1/health"], interval: 5s, timeout: 3s, retries: 30}
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
