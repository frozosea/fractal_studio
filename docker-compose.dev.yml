name: fractal-studio-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fractal_platform
      POSTGRES_USER: fractal
      POSTGRES_PASSWORD: fractal_dev_password
    ports: ["${POSTGRES_PORT:-15442}:5432"]
    volumes: [platform-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fractal -d fractal_platform"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["${REDIS_PORT:-16389}:6379"]
    volumes: [platform-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports: ["${MINIO_PORT:-19010}:9000", "${MINIO_CONSOLE_PORT:-19011}:9001"]
    volumes: [platform-minio:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_password
      S3_BUCKET: fractal-platform
    entrypoint: >-
      /bin/sh -ec 'until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done; mc mb --ignore-existing "local/$$S3_BUCKET";'

  compute:
    image: fractal-studio-dev-compute
    build:
      context: .
      dockerfile: backend/Dockerfile
      additional_contexts:
        cuda-toolkit: ./.cuda-toolkit
    restart: unless-stopped
    runtime: nvidia
    gpus: all
    environment:
      FSD_STARTUP_BENCHMARK: "off"
      FSD_COMPUTE_SERVICE_KEY: ${FSD_COMPUTE_SERVICE_KEY:-dev-compute-key-change-me}
      FSD_RENDERER_VERSION: compose-dev-a
      FSD_ENABLE_LEGACY_API: "0"
      FSD_ENABLE_LEGACY_FORMULA_COMPILER: "0"
      FSD_RENDER_THREADS: "2"
    ports: ["${COMPUTE_PORT:-18101}:18080"]
    volumes: [compute-a-runtime:/workspace/fractal_studio/runtime]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/compute/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 60

  compute-b:
    image: fractal-studio-dev-compute
    restart: unless-stopped
    runtime: nvidia
    gpus: all
    environment:
      FSD_STARTUP_BENCHMARK: "off"
      FSD_COMPUTE_SERVICE_KEY: ${FSD_COMPUTE_SERVICE_KEY:-dev-compute-key-change-me}
      FSD_RENDERER_VERSION: compose-dev-b
      FSD_ENABLE_LEGACY_API: "0"
      FSD_ENABLE_LEGACY_FORMULA_COMPILER: "0"
      FSD_RENDER_THREADS: "2"
    ports: ["${COMPUTE_B_PORT:-18104}:18080"]
    volumes: [compute-b-runtime:/workspace/fractal_studio/runtime]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/compute/v1/health"]
      interval: 2s
      timeout: 2s
      retries: 60

  compute-gateway-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: compute_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${COMPUTE_GATEWAY_DB_PASSWORD:-gateway_dev_password}
    ports: ["${COMPUTE_GATEWAY_POSTGRES_PORT:-25443}:5432"]
    volumes: [compute-gateway-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d compute_gateway"]
      interval: 2s
      timeout: 2s
      retries: 30

  compute-gateway-migrate:
    image: fractal-studio-dev-compute-gateway
    build:
      context: ./compute-gateway
    command: ["uv", "run", "--no-sync", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: &gateway-env
      DATABASE_URL: postgresql+asyncpg://gateway:${COMPUTE_GATEWAY_DB_PASSWORD:-gateway_dev_password}@compute-gateway-db:5432/compute_gateway
      COMPUTE_GATEWAY_SERVICE_KEY: ${COMPUTE_GATEWAY_SERVICE_KEY:-dev-gateway-key-change-me}
      COMPUTE_GATEWAY_ADMIN_KEY: ${COMPUTE_GATEWAY_ADMIN_KEY:-dev-gateway-admin-key-change-me}
      COMPUTE_UPSTREAM_SERVICE_KEY: ${FSD_COMPUTE_SERVICE_KEY:-dev-compute-key-change-me}
    volumes:
      - ./compute-gateway:/app
    depends_on:
      compute-gateway-db:
        condition: service_healthy

  compute-gateway:
    image: fractal-studio-dev-compute-gateway
    build:
      context: ./compute-gateway
    restart: unless-stopped
    environment:
      <<: *gateway-env
      COMPUTE_GATEWAY_BOOTSTRAP_NODES_JSON: '[{"nodeKey":"compute-a","baseUrl":"http://compute:18080","maxDurableSlots":1,"maxPreviewSlots":2,"enabled":true},{"nodeKey":"compute-b","baseUrl":"http://compute-b:18080","maxDurableSlots":1,"maxPreviewSlots":2,"enabled":true}]'
    ports: ["${COMPUTE_GATEWAY_PORT:-18103}:8080"]
    volumes:
      - ./compute-gateway:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/compute/v1/health', timeout=2).read()"]
      interval: 2s
      timeout: 10s
      retries: 30
    depends_on:
      compute-gateway-migrate:
        condition: service_completed_successfully
      compute:
        condition: service_healthy
      compute-b:
        condition: service_healthy

  alipay-stub:
    build:
      context: ./platform-backend
    command: ["uv", "run", "--no-sync", "uvicorn", "tests.e2e.fixtures.alipay_stub:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports: ["${ALIPAY_STUB_PORT:-18102}:8000"]

  migrate:
    build:
      context: ./platform-backend
    command: ["uv", "run", "--no-sync", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: &platform-env
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://fractal:fractal_dev_password@postgres:5432/fractal_platform
      MIGRATION_DATABASE_URL: postgresql+psycopg://fractal:fractal_dev_password@postgres:5432/fractal_platform
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-32-bytes-minimum}
      SESSION_COOKIE_SECURE: "false"
      API_ORIGIN: ${FSD_API_ORIGIN:-http://localhost:3010}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3010},${FSD_API_ORIGIN:-http://localhost:3010}
      COMPUTE_BASE_URL: http://compute-gateway:8080
      COMPUTE_SERVICE_KEY: ${COMPUTE_GATEWAY_SERVICE_KEY:-dev-gateway-key-change-me}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${FSD_S3_PUBLIC_ENDPOINT_URL:-http://localhost:19010}
      S3_BUCKET: fractal-platform
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio_dev_password
      ALIPAY_STUB_MODE: "false"
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-9021000166609768}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-2088721106011274}
      ALIPAY_STUB_PUBLIC_KEY_URL: ""
      ALIPAY_GATEWAY_URL: ${ALIPAY_GATEWAY_URL:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-https://fractal.kevin0412.top/platform/v1/webhooks/alipay}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-https://fractal.kevin0412.top/payment-result}
      ALIPAY_PRIVATE_KEY_PATH: /run/secrets/alipay_app_private.pem
      ALIPAY_PUBLIC_KEY_PATH: /run/secrets/alipay_sandbox_public.pem
      PAYMENT_RECONCILE_DELAY_SECONDS: "1"
      OUTBOX_POLL_INTERVAL_SECONDS: "0.5"
      OUTBOX_SCHEDULE_INTERVAL_SECONDS: "1"
    volumes:
      - ./platform-backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./platform-backend
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment: *platform-env
    ports: ["${PLATFORM_PORT:-18100}:8000"]
    volumes:
      - ./platform-backend:/app
      - ./alipay_app_private.pem:/run/secrets/alipay_app_private.pem:ro
      - ./alipay_sandbox_public.pem:/run/secrets/alipay_sandbox_public.pem:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      compute-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./platform-backend
    command: ["uv", "run", "--no-sync", "python", "-m", "app.outbox.worker"]
    restart: unless-stopped
    environment: *platform-env
    volumes:
      - ./platform-backend:/app
      - ./alipay_app_private.pem:/run/secrets/alipay_app_private.pem:ro
      - ./alipay_sandbox_public.pem:/run/secrets/alipay_sandbox_public.pem:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      compute-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

  preview-worker:
    # Reuse API image in development; source is bind-mounted below.
    image: fractal-studio-dev-api
    command: ["uv", "run", "--no-sync", "python", "-m", "app.studio.preview_worker"]
    restart: unless-stopped
    environment: *platform-env
    volumes:
      - ./platform-backend:/app
      - ./alipay_app_private.pem:/run/secrets/alipay_app_private.pem:ro
      - ./alipay_sandbox_public.pem:/run/secrets/alipay_sandbox_public.pem:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      compute-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_PLATFORM_API_URL: /platform
      PLATFORM_INTERNAL_URL: http://api:8000
    command: ["/bin/sh", "/app/scripts/dev-frontend.sh"]
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-3010}:3000"]
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      api:
        condition: service_started

volumes:
  platform-postgres:
  platform-redis:
  platform-minio:
  compute-a-runtime:
  compute-b-runtime:
  compute-gateway-postgres:
  frontend-node-modules:
  frontend-next-cache:
