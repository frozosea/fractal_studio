openapi: 3.1.0
info:
  title: Fractal Compute private v1 API
  version: 1.0.0
  description: |
    Authoritative Platform Worker contract for the current C++ Compute v1 server.
    Legacy /api/* routes are explicitly outside this contract.
servers:
  - url: http://compute.internal
security:
  - ComputeServiceKey: []
paths:
  /compute/v1/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Unauthenticated private-network liveness response
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, status, service, rendererVersion]
  /compute/v1/capabilities:
    get:
      operationId: capabilities
      responses:
        '200':
          description: Authenticated renderer capabilities
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Problem' }
  /compute/v1/previews:
    post:
      operationId: renderMapPreview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewRequest' }
      responses:
        '200':
          description: RGBA8 preview frame
          headers:
            X-FSD-Width: { schema: { type: integer } }
            X-FSD-Height: { schema: { type: integer } }
            X-FSD-Pixel-Format: { schema: { type: string, const: rgba8 } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /compute/v1/runs:
    post:
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRunRequest' }
      responses:
        '202':
          description: Created or idempotently reused Compute run
          content:
            application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /compute/v1/runs/{computeRunId}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/ComputeRunId'
      responses:
        '200':
          description: Current run state; HTTP success does not mean render success
          content:
            application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /compute/v1/runs/{computeRunId}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/ComputeRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '202':
          description: Cancellation intent accepted; caller continues polling
          content:
            application/json: { schema: { $ref: '#/components/schemas/RunEnvelope' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /compute/v1/runs/{computeRunId}/manifest:
    get:
      operationId: getCompletedManifest
      parameters:
        - $ref: '#/components/parameters/ComputeRunId'
      responses:
        '200':
          description: Manifest; accept artifacts only when status is completed
          content:
            application/json: { schema: { $ref: '#/components/schemas/Manifest' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /compute/v1/artifacts:
    get:
      operationId: streamArtifact
      parameters:
        - name: artifactId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Private artifact bytes
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '206':
          description: Optional single-range response
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    ComputeServiceKey:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-key
  parameters:
    ComputeRunId:
      name: computeRunId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    ComputeEnvelope:
      type: object
      required: [schemaVersion, kind, payload]
      properties:
        schemaVersion: { type: integer, const: 1 }
        kind: { type: string, enum: [map_image, zoom_video, hs_mesh, transition_mesh] }
        payload: { type: object }
    PreviewRequest:
      allOf:
        - $ref: '#/components/schemas/ComputeEnvelope'
        - type: object
          properties:
            kind: { const: map_image }
            payload: { $ref: '#/components/schemas/MapPayload' }
    CreateRunRequest:
      oneOf:
        - $ref: '#/components/schemas/MapImageRunRequest'
        - $ref: '#/components/schemas/ZoomVideoRunRequest'
        - $ref: '#/components/schemas/HsMeshRunRequest'
        - $ref: '#/components/schemas/TransitionMeshRunRequest'
      description: |
        Platform worker currently emits `map_image`, `zoom_video`, `hs_mesh` and
        `transition_mesh`. Payload shape is selected by `kind`; generated clients
        must preserve `schemaVersion`, `kind`, `payload` and `idempotencyKey`.
    MapImageRunRequest:
      allOf:
        - $ref: '#/components/schemas/ComputeEnvelope'
        - $ref: '#/components/schemas/IdempotentRequest'
        - type: object
          properties:
            kind: { const: map_image }
            payload: { $ref: '#/components/schemas/MapPayload' }
    ZoomVideoRunRequest:
      allOf:
        - $ref: '#/components/schemas/ComputeEnvelope'
        - $ref: '#/components/schemas/IdempotentRequest'
        - type: object
          properties:
            kind: { const: zoom_video }
            payload: { $ref: '#/components/schemas/VideoPayload' }
    HsMeshRunRequest:
      allOf:
        - $ref: '#/components/schemas/ComputeEnvelope'
        - $ref: '#/components/schemas/IdempotentRequest'
        - type: object
          properties:
            kind: { const: hs_mesh }
            payload: { $ref: '#/components/schemas/HsMeshPayload' }
    TransitionMeshRunRequest:
      allOf:
        - $ref: '#/components/schemas/ComputeEnvelope'
        - $ref: '#/components/schemas/IdempotentRequest'
        - type: object
          properties:
            kind: { const: transition_mesh }
            payload: { $ref: '#/components/schemas/TransitionMeshPayload' }
    IdempotentRequest:
      type: object
      required: [idempotencyKey]
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable platform-job UUID key; same kind/payload returns same run.
    MapPayload:
      type: object
      required: [width, height, iterations, variant, centerRe, centerIm, scale, julia, bailout, engine, scalarType]
      properties:
        width: { type: integer, minimum: 64, maximum: 4096 }
        height: { type: integer, minimum: 64, maximum: 4096 }
        iterations: { type: integer, minimum: 1, maximum: 1000000 }
        variant: { type: string, minLength: 1, maxLength: 64 }
        centerRe: { type: number }
        centerIm: { type: number }
        scale: { type: number, exclusiveMinimum: 0 }
        julia: { type: boolean }
        juliaRe: { type: number }
        juliaIm: { type: number }
        bailout: { type: number, exclusiveMinimum: 0 }
        colorMap: { type: string, minLength: 1, maxLength: 64 }
        engine: { type: string, enum: [auto, openmp, cuda] }
        scalarType: { type: string, enum: [auto, fp32, fp64, fp80] }
    VideoPayload:
      allOf:
        - $ref: '#/components/schemas/MapPayload'
        - type: object
          required: [fps, durationSec, depthOctaves]
          properties:
            width: { type: integer, minimum: 128, maximum: 1920 }
            height: { type: integer, minimum: 128, maximum: 1080 }
            fps: { type: integer, minimum: 1, maximum: 60 }
            durationSec: { type: number, exclusiveMinimum: 0, maximum: 30 }
            depthOctaves: { type: number, exclusiveMinimum: 0 }
    HsMeshPayload:
      type: object
      required: [centerRe, centerIm, scale, resolution, iterations, variant, bailout]
      properties:
        centerRe: { type: number }
        centerIm: { type: number }
        scale: { type: number, exclusiveMinimum: 0 }
        resolution: { type: integer, minimum: 8, maximum: 1024 }
        iterations: { type: integer, minimum: 1, maximum: 1000000 }
        variant: { type: string, minLength: 1, maxLength: 64 }
        bailout: { type: number, exclusiveMinimum: 0 }
        heightScale: { type: number }
        heightClamp: { type: number, exclusiveMinimum: 0 }
    TransitionMeshPayload:
      type: object
      required: [resolution, iterations, centerX, centerY, centerZ, extent, transitionFrom, transitionTo]
      properties:
        resolution: { type: integer, minimum: 8, maximum: 1024 }
        iterations: { type: integer, minimum: 1, maximum: 10000 }
        centerX: { type: number }
        centerY: { type: number }
        centerZ: { type: number }
        extent: { type: number, exclusiveMinimum: 0 }
        transitionFrom: { type: string, minLength: 1, maxLength: 64 }
        transitionTo: { type: string, minLength: 1, maxLength: 64 }
        bailout: { type: number, exclusiveMinimum: 0 }
        iso: { type: number }
        engine: { type: string, enum: [auto, cpu, cuda] }
        scalarType: { type: string, enum: [fp32, fp64] }
    RunEnvelope:
      type: object
      required: [schemaVersion, data]
      properties:
        schemaVersion: { type: integer, const: 1 }
        data:
          type: object
          required: [computeRunId, status]
          properties:
            computeRunId: { type: string }
            kind: { type: string }
            status: { type: string, enum: [queued, running, completed, failed, cancelled] }
            progress: { type: object, additionalProperties: true }
            artifacts:
              type: array
              items: { $ref: '#/components/schemas/ArtifactSummary' }
    Manifest:
      type: object
      required: [schemaVersion, computeRunId, status, artifacts]
      properties:
        schemaVersion: { type: integer, const: 1 }
        computeRunId: { type: string }
        rendererVersion: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/ArtifactSummary' }
    ArtifactSummary:
      type: object
      required: [artifactId, mediaType, sizeBytes]
      properties:
        artifactId: { type: string }
        name: { type: string }
        kind: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, minimum: 1, maximum: 524288000 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    Problem:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
  responses:
    Problem:
      description: Stable Compute error envelope
      content:
        application/json: { schema: { $ref: '#/components/schemas/Problem' } }
